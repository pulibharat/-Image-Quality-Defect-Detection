services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////app/backend/data/app.db
      MODEL_DIR: /app/backend/models_store
      UPLOAD_DIR: /app/backend/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      ALLOWED_CONTENT_TYPES: ${ALLOWED_CONTENT_TYPES:-image/jpeg,image/png,image/webp,image/bmp,image/tiff}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - backend_data:/app/backend/data
      - backend_uploads:/app/backend/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:
